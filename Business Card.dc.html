<style>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;qrTarget&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Portfolio site&quot;,&quot;Email address&quot;,&quot;Phone number&quot;,&quot;LinkedIn&quot;,&quot;Contact card (vCard)&quot;],&quot;default&quot;:&quot;Portfolio site&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;QR code&quot;},&quot;qrUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;erikthomas.dev&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;QR code&quot;},&quot;showGuides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Print&quot;}}">
class Component extends DCLogic {
  payload() {
    const t = this.props.qrTarget || 'Portfolio site';
    let url = this.props.qrUrl || 'https://itch.io/profile/ermendq';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url.replace(/^\/+/, '');
    if (t === 'Email address') return 'mailto:erikthom.dev@proton.me';
    if (t === 'Phone number') return 'tel:+36308263730';
    if (t === 'LinkedIn') return 'https://www.linkedin.com/in/erik-thomas-abb447262/';
    if (t === 'Contact card (vCard)') {
      return ['BEGIN:VCARD', 'VERSION:3.0', 'N:Thomas;Erik', 'FN:Erik Thomas',
        'TEL;TYPE=CELL:+36308263730', 'EMAIL:erikthom.dev@proton.me',
        'URL:' + url, 'END:VCARD'].join('\n');
    }
    return url;
  }

  // --- GF(256) ---
  gf() {
    if (this._E) return;
    const E = new Array(256), L = new Array(256);
    for (let i = 0; i < 8; i++) E[i] = 1 << i;
    for (let i = 8; i < 256; i++) E[i] = E[i - 4] ^ E[i - 5] ^ E[i - 6] ^ E[i - 8];
    for (let i = 0; i < 255; i++) L[E[i]] = i;
    this._E = E; this._L = L;
  }
  mul(a, b) { return (a === 0 || b === 0) ? 0 : this._E[(this._L[a] + this._L[b]) % 255]; }
  digit(d) { let n = 0; while (d !== 0) { n++; d >>>= 1; } return n; }
  bch(d, poly) { const p = this.digit(poly); while (this.digit(d) - p >= 0) d ^= poly << (this.digit(d) - p); return d; }
  genPoly(n) {
    let g = [1];
    for (let i = 0; i < n; i++) {
      const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= this.mul(g[j], this._E[i % 255]); }
      g = ng;
    }
    return g;
  }
  ecc(d, len) {
    const g = this.genPoly(len);
    const r = d.concat(new Array(len).fill(0));
    for (let i = 0; i < d.length; i++) {
      const c = r[i];
      if (c === 0) continue;
      for (let j = 0; j < g.length; j++) r[i + j] ^= this.mul(g[j], c);
    }
    return r.slice(d.length);
  }

  maskBit(p, i, j) {
    switch (p) {
      case 0: return (i + j) % 2 === 0;
      case 1: return i % 2 === 0;
      case 2: return j % 3 === 0;
      case 3: return (i + j) % 3 === 0;
      case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
      case 5: return ((i * j) % 2) + ((i * j) % 3) === 0;
      case 6: return (((i * j) % 2) + ((i * j) % 3)) % 2 === 0;
      default: return (((i * j) % 3) + ((i + j) % 2)) % 2 === 0;
    }
  }

  lost(m) {
    const n = m.length;
    let lost = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let same = 0;
      const dark = m[r][c];
      for (let dr = -1; dr <= 1; dr++) {
        if (r + dr < 0 || r + dr >= n) continue;
        for (let dc = -1; dc <= 1; dc++) {
          if (c + dc < 0 || c + dc >= n || (dr === 0 && dc === 0)) continue;
          if (dark === m[r + dr][c + dc]) same++;
        }
      }
      if (same > 5) lost += 3 + same - 5;
    }
    for (let r = 0; r < n - 1; r++) for (let c = 0; c < n - 1; c++) {
      let k = 0;
      if (m[r][c]) k++; if (m[r + 1][c]) k++; if (m[r][c + 1]) k++; if (m[r + 1][c + 1]) k++;
      if (k === 0 || k === 4) lost += 3;
    }
    for (let r = 0; r < n; r++) for (let c = 0; c < n - 6; c++)
      if (m[r][c] && !m[r][c + 1] && m[r][c + 2] && m[r][c + 3] && m[r][c + 4] && !m[r][c + 5] && m[r][c + 6]) lost += 40;
    for (let c = 0; c < n; c++) for (let r = 0; r < n - 6; r++)
      if (m[r][c] && !m[r + 1][c] && m[r + 2][c] && m[r + 3][c] && m[r + 4][c] && !m[r + 5][c] && m[r + 6][c]) lost += 40;
    let dark = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) dark++;
    lost += (Math.abs(100 * dark / n / n - 50) / 5) * 10;
    return lost;
  }

  matrix(text) {
    this.gf();
    const RS = {
      1: [[1, 26, 16]], 2: [[1, 44, 28]], 3: [[1, 70, 44]], 4: [[2, 50, 32]], 5: [[2, 67, 43]],
      6: [[4, 43, 27]], 7: [[4, 49, 31]], 8: [[2, 60, 38], [2, 61, 39]],
      9: [[3, 58, 36], [2, 59, 37]], 10: [[4, 69, 43], [1, 70, 44]]
    };
    const ALIGN = {
      1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
      6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
    };
    let bytes = Array.from(new TextEncoder().encode(text));
    let version = 0, dataCw = 0, lenBits = 8;
    for (let v = 1; v <= 10; v++) {
      const dc = RS[v].reduce((s, b) => s + b[0] * b[2], 0);
      const lb = v < 10 ? 8 : 16;
      if (4 + lb + 8 * bytes.length <= dc * 8) { version = v; dataCw = dc; lenBits = lb; break; }
    }
    if (!version) {
      version = 10; dataCw = RS[10].reduce((s, b) => s + b[0] * b[2], 0); lenBits = 16;
      bytes = bytes.slice(0, Math.floor((dataCw * 8 - 4 - lenBits) / 8));
    }

    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, lenBits);
    for (const b of bytes) put(b, 8);
    const total = dataCw * 8;
    for (let i = 0; i < Math.min(4, total - bits.length); i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }
    const PAD = [0xEC, 0x11];
    while (data.length < dataCw) data.push(PAD[(data.length - bits.length / 8) % 2 === 0 ? 0 : 1]);

    const blocks = [];
    let off = 0;
    for (const [count, tot, dcount] of RS[version]) {
      for (let i = 0; i < count; i++) {
        const d = data.slice(off, off + dcount);
        off += dcount;
        blocks.push({ d, e: this.ecc(d, tot - dcount) });
      }
    }
    const maxD = Math.max.apply(null, blocks.map(b => b.d.length));
    const maxE = Math.max.apply(null, blocks.map(b => b.e.length));
    const out = [];
    for (let i = 0; i < maxD; i++) for (const b of blocks) if (i < b.d.length) out.push(b.d[i]);
    for (let i = 0; i < maxE; i++) for (const b of blocks) if (i < b.e.length) out.push(b.e[i]);

    const size = version * 4 + 17;
    const build = (mask) => {
      const m = [];
      for (let i = 0; i < size; i++) m.push(new Array(size).fill(null));
      const finder = (r, c) => {
        for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
          m[rr][cc] = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
            (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
            (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        }
      };
      finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
      for (const r of ALIGN[version]) for (const c of ALIGN[version]) {
        if (m[r][c] !== null) continue;
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
          m[r + dr][c + dc] = Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
      }
      for (let i = 8; i < size - 8; i++) {
        if (m[i][6] === null) m[i][6] = i % 2 === 0;
        if (m[6][i] === null) m[6][i] = i % 2 === 0;
      }
      const fd = (0 << 3) | mask;
      const fmt = ((fd << 10) | this.bch(fd << 10, 0x537)) ^ 0x5412;
      for (let i = 0; i < 15; i++) {
        const b = ((fmt >> i) & 1) === 1;
        if (i < 6) m[i][8] = b;
        else if (i < 8) m[i + 1][8] = b;
        else m[size - 15 + i][8] = b;
      }
      for (let i = 0; i < 15; i++) {
        const b = ((fmt >> i) & 1) === 1;
        if (i < 8) m[8][size - i - 1] = b;
        else if (i < 9) m[8][15 - i] = b;
        else m[8][14 - i] = b;
      }
      m[size - 8][8] = true;
      if (version >= 7) {
        const vb = (version << 12) | this.bch(version << 12, 0x1F25);
        for (let i = 0; i < 18; i++) {
          const b = ((vb >> i) & 1) === 1;
          m[Math.floor(i / 3)][i % 3 + size - 8 - 3] = b;
          m[i % 3 + size - 8 - 3][Math.floor(i / 3)] = b;
        }
      }
      let inc = -1, row = size - 1, bi = 7, byi = 0;
      for (let col = size - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        for (;;) {
          for (let c = 0; c < 2; c++) {
            if (m[row][col - c] === null) {
              let d = false;
              if (byi < out.length) d = ((out[byi] >>> bi) & 1) === 1;
              if (this.maskBit(mask, row, col - c)) d = !d;
              m[row][col - c] = d;
              bi--;
              if (bi === -1) { byi++; bi = 7; }
            }
          }
          row += inc;
          if (row < 0 || row >= size) { row -= inc; inc = -inc; break; }
        }
      }
      return m;
    };
    let best = null, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const m = build(mask);
      const s = this.lost(m);
      if (s < bestScore) { bestScore = s; best = m; }
    }
    return best;
  }

  qrSrc() {
    const p = this.payload();
    if (this._qr && this._qr.p === p) return this._qr.src;
    let src = '';
    try {
      const m = this.matrix(p);
      const n = m.length;
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) d += 'M' + c + ' ' + r + 'h1v1h-1z';
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n +
        '" shape-rendering="crispEdges"><path fill="#0b1811" d="' + d + '"/></svg>';
      src = 'data:image/svg+xml,' + encodeURIComponent(svg);
    } catch (e) { src = ''; }
    this._qr = { p, src };
    return src;
  }

  componentDidMount() {
    // React appends the .page sections after <doc-page> connects, so nudge
    // the component to re-detect explicit pagination.
    const kick = () => {
      const dp = document.querySelector('doc-page');
      if (!dp) return;
      if (typeof dp._measure === 'function') dp._measure();
      else if (dp.hasAttribute('width')) dp.setAttribute('width', dp.getAttribute('width'));
    };
    requestAnimationFrame(kick);
    setTimeout(kick, 80);
    setTimeout(kick, 400);
  }

  qrRef = (el) => {
    this._qrEl = el;
    if (el) el.src = this.qrSrc();
  };

  componentDidUpdate() {
    if (this._qrEl) this._qrEl.src = this.qrSrc();
  }

  renderVals() {
    return { qrRef: this.qrRef, guides: !!this.props.showGuides };
  }
}

</script>
