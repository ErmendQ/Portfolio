<style>
/* Controls and accents are pine on every route. The open quest's cover hue (--h/--s, set
   from JS) only tints the backdrop, so the character menu keeps its colour. */
:root {
  --h: 145; --s: 20;
  --ground: #07110b;
  --ink: #e8f1ea;
  --ink-2: rgba(228,240,232,.78);
  --ink-3: rgba(228,240,232,.62);
  --hair: rgba(198,228,208,.13);
  --edge: rgba(242,254,246,.26);
  --acc: #a9d2b8;
  --acc-line: rgba(169,210,184,.36);
  --acc-fill: rgba(122,184,146,.14);
  --solid: #b9d8c4;
  --solid-hi: #cde6d6;
  --on-solid: #0b1a11;
  --tint: hsla(var(--h), calc((var(--s) + 26) * 1%), 26%, .18);
  --r: 24px;
  --disp: 'Archivo', system-ui, sans-serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
html { background: var(--ground); color-scheme: dark; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; font: 400 16px/1.6 var(--sans); color: var(--ink); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; caret-color: var(--acc); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
img, video, svg { display: block; }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
::selection { background: rgba(122,184,146,.4); color: #fff; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 10px; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(178,214,190,.22); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
* { scrollbar-width: thin; scrollbar-color: rgba(178,214,190,.3) transparent; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 10px 16px; border-radius: 12px; background: var(--solid); color: var(--on-solid); font-weight: 600; }
.skip:focus { top: 12px; }

/* Backdrop: pre-blurred by tools/optimize-media.py, so it costs no filter pass. */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg > div { position: absolute; inset: 0; }
.bg .img { inset: -6%; background: center / cover no-repeat; }
.bg .base { background-image: url(assets/web/backdrop-bg.webp); }
.bg .cover { opacity: 0; transition: opacity .7s ease; }
.bg .vig { background: radial-gradient(130% 100% at 50% 30%, rgba(8,24,16,0) 0%, rgba(4,12,8,.5) 90%); }
.bg .tint { background: var(--tint); mix-blend-mode: soft-light; opacity: 0; transition: opacity .7s ease; }
.in-quest .bg .cover, .in-quest .bg .tint { opacity: 1; }

/* Glass: the one surface material. Phones get the fill without the blur pass. */
.glass { position: relative; border-radius: var(--r); border: 1px solid rgba(226,244,232,.16); background: linear-gradient(162deg, rgba(236,248,240,.1) 0%, rgba(210,232,218,.04) 48%, rgba(6,14,10,.2) 100%), rgba(18,36,26,.58); box-shadow: inset 0 1px 0 var(--edge), 0 30px 60px -34px rgba(0,0,0,.7); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(226,244,232,.18); background: rgba(236,248,240,.06); box-shadow: inset 0 1px 0 rgba(242,254,246,.16); font: 600 15px/1 var(--sans); color: var(--ink); cursor: pointer; transition: background .2s ease, border-color .2s ease, transform .2s var(--ease); }
.btn.solid { background: var(--solid); border-color: transparent; color: var(--on-solid); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 24px -12px rgba(0,0,0,.65); }
.btn.icon { width: 48px; padding: 0; }
.btn.cv { padding: 0 14px; gap: 7px; }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid rgba(226,244,232,.22); border-bottom-width: 2px; background: rgba(236,248,240,.06); font: 500 11px/1 var(--mono); color: var(--ink-2); }

/* Layout */
.app { max-width: 1320px; margin: 0 auto; }
main { min-width: 0; }
main:focus, main:focus-visible { outline: none; }
.sec { padding: 40px 16px 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
h2.h { font: 700 28px/1.1 var(--disp); letter-spacing: -.01em; text-wrap: balance; }
.count { font: 400 13px var(--mono); color: var(--ink-3); white-space: nowrap; }

/* Section strip (phones and tablets) */
.strip { position: sticky; top: 0; z-index: 20; display: flex; align-items: stretch; height: 56px; padding: 0 6px 0 4px; background: rgba(9,21,14,.9); border-bottom: 1px solid var(--hair); box-shadow: 0 10px 30px -18px rgba(0,0,0,.8); }
.strip a { position: relative; display: flex; align-items: center; justify-content: center; }
.strip .tab { flex: 1 1 0; min-width: 0; padding: 0 6px; font: 600 14px/1 var(--sans); color: var(--ink-3); white-space: nowrap; transition: color .2s ease; }
.strip .tab::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; border-radius: 2px; background: var(--acc); opacity: 0; transform: scaleX(.4); transition: opacity .25s ease, transform .35s var(--ease); }
.strip .tab[aria-current="true"] { color: var(--ink); }
.strip .tab[aria-current="true"]::after { opacity: 1; transform: none; }
.strip .mail { width: 48px; flex: none; color: var(--acc); }

/* Character card / panel */
.char { margin: 14px 12px 0; padding: 18px; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.pf { position: relative; grid-row: span 2; width: 88px; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: radial-gradient(120% 100% at 45% 35%, #2c5c41 0%, #1b3a29 55%, #112418 100%); box-shadow: inset 0 0 0 1px rgba(226,244,232,.18); }
.pf img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; transform: scale(1.12); transform-origin: 50% 24%; }
.pf::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(242,254,246,.3), inset 0 -30px 40px -30px rgba(4,12,8,.8); }
.name { font: 800 24px/1.05 var(--disp); letter-spacing: .12em; text-transform: uppercase; align-self: end; }
.cls { font-size: 14px; line-height: 1.4; color: var(--acc); align-self: start; }
.lead { grid-column: 1 / -1; margin-top: 14px; font: 600 17px/1.45 var(--disp); color: var(--ink); text-wrap: pretty; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 16px; border-radius: 16px; overflow: hidden; background: var(--hair); border: 1px solid var(--hair); }
.stats > div { padding: 10px 12px; background: rgba(10,22,15,.55); min-width: 0; }
.stats dt { font-size: 12px; color: var(--ink-3); }
.stats dd { font: 600 14px/1.35 var(--sans); color: var(--ink); margin-top: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7fd49a; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); margin-right: 7px; vertical-align: 1px; }
.acts { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; margin-top: 16px; }
.lang { display: flex; gap: 2px; padding: 3px; border-radius: 16px; border: 1px solid rgba(198,228,208,.2); background: rgba(8,18,12,.5); }
.lang button[aria-pressed="true"] { display: none; }
.lang button { appearance: none; border: 0; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 999px; background: transparent; font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--ink-3); cursor: pointer; transition: background .2s ease, color .2s ease; }
.lang button[aria-pressed="true"] { background: rgba(150,200,168,.26); color: var(--ink); }
.menu, .keys, .lead-main { display: none; }

/* Quest log */
.sheet { overflow: hidden; }
.quest { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px 16px; padding: 18px 16px; border-top: 1px solid var(--hair); transition: background .25s ease; }
.quest:first-child { border-top: 0; }
.q-thumb { position: relative; aspect-ratio: 16/10; border-radius: 12px; overflow: hidden; background: #0f2418; box-shadow: inset 0 0 0 1px rgba(226,244,232,.12); align-self: start; }
.q-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transition: transform .5s var(--ease); }
.q-top { min-width: 0; }
.q-name { font: 700 19px/1.2 var(--disp); letter-spacing: .01em; }
.q-link::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.q-meta { margin-top: 5px; font: 400 12.5px/1.5 var(--mono); color: var(--ink-3); }
.q-rest { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 14px; }
.q-blurb { font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.obj { display: flex; flex-direction: column; gap: 8px; }
.obj li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
.ck { width: 20px; height: 20px; margin-top: 1px; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ck circle { stroke: var(--acc-line); }
.ck path { stroke: var(--acc); stroke-width: 2.1; }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--hair); background: rgba(236,248,240,.045); font: 500 13px/1 var(--sans); color: var(--ink-2); transition: background .2s ease, border-color .2s ease, color .2s ease; }
.chip .i { width: 15px; height: 15px; }
a.chip { color: var(--ink); border-color: rgba(226,244,232,.2); }
.chip.info { background: transparent; }
.locked { margin-top: 28px; }
.locked h3 { display: flex; align-items: center; gap: 8px; font: 600 15px/1.2 var(--sans); color: var(--ink-2); margin: 0 4px 10px; }
.locked ul { display: grid; gap: 1px; background: var(--hair); border-radius: 18px; overflow: hidden; border: 1px solid var(--hair); }
.locked li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: rgba(10,22,15,.6); color: var(--ink-3); }
.locked li b { font: 600 15px/1.3 var(--sans); color: var(--ink-2); }
.locked li span { font: 400 12.5px var(--mono); }
.locked h3 small { font: 400 13px var(--sans); color: var(--ink-3); margin-left: auto; }

/* Skills */
.intro { max-width: 68ch; font-size: 16px; line-height: 1.7; color: var(--ink-2); text-wrap: pretty; }
.skills { margin-top: 24px; overflow: hidden; }
.sk-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 18px 16px; border-top: 1px solid var(--hair); }
.sk-row:first-child { border-top: 0; }
.sk-row h3 { font: 700 16px/1.25 var(--disp); color: var(--acc); }
.sk-row p { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
.sk-row ul { display: flex; flex-wrap: wrap; gap: 7px; }
.sk-row li { padding: 7px 11px; border-radius: 10px; border: 1px solid var(--hair); background: rgba(236,248,240,.05); font-size: 14px; line-height: 1.2; color: var(--ink-2); }

/* Contact */
.c-lead { max-width: 30ch; font: 600 24px/1.3 var(--disp); text-wrap: balance; }
.c-body { max-width: 62ch; margin-top: 12px; font-size: 16px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; }
.mail-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 22px; }
.mail-row .btn.solid { min-width: 0; }
.mail-row .addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copied { font-size: 14px; color: var(--acc); opacity: 0; transition: opacity .2s ease; }
.copied.on { opacity: 1; }
.links { margin-top: 26px; display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 18px; overflow: hidden; }
.links a { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; background: rgba(10,22,15,.62); transition: background .2s ease; }
.links .k { width: 78px; flex: none; font-size: 13px; color: var(--ink-3); }
.links .v { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.links .i { color: var(--ink-3); }
.fb { margin-top: 30px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.fb h3 { font: 700 18px/1.2 var(--disp); }
.fb > p { font-size: 15px; line-height: 1.6; color: var(--ink-2); max-width: 64ch; }
.fb .two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.fb input, .fb textarea { width: 100%; box-sizing: border-box; font: 16px/1.5 var(--sans); color: var(--ink); background: rgba(6,14,10,.55); border: 1px solid rgba(198,228,208,.2); border-radius: 14px; padding: 12px 14px; outline: none; transition: border-color .2s ease, background .2s ease; }
.fb textarea { min-height: 110px; resize: vertical; display: block; }
.fb input:focus, .fb textarea:focus { border-color: var(--acc-line); background: rgba(6,14,10,.75); }
.fb ::placeholder { color: var(--ink-3); }
.fb .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.fb .status { font-size: 14px; color: var(--acc); }
.fb .status.err { color: #f0a79c; }
.fb button:disabled { opacity: .6; cursor: progress; }
.fb .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
footer { padding: 40px 16px 48px; font-size: 13px; color: var(--ink-3); }

/* Quest brief */
.brief { padding: 18px 16px 8px; }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 8px; margin-left: -4px; border-radius: 14px; font-weight: 500; font-size: 15px; color: var(--ink-2); transition: background .2s ease, color .2s ease; }
.back kbd { margin-left: 4px; display: none; }
.b-title { margin-top: 14px; font: 800 38px/1.02 var(--disp); letter-spacing: -.015em; text-wrap: balance; }
.b-sum { max-width: 64ch; margin-top: 14px; font-size: 17px; line-height: 1.6; color: var(--ink-2); text-wrap: pretty; }
.b-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 20px; border-radius: 16px; overflow: hidden; background: var(--hair); border: 1px solid var(--hair); }
.b-meta > div { padding: 10px 12px; background: rgba(10,22,15,.6); min-width: 0; }
.b-meta dt { font-size: 12px; color: var(--ink-3); }
.b-meta dd { font-weight: 600; font-size: 14px; line-height: 1.35; margin-top: 2px; }
.b-hero { position: relative; margin-top: 22px; aspect-ratio: 16/9; border-radius: 20px; overflow: hidden; background: #0a0f0d; box-shadow: inset 0 0 0 1px rgba(226,244,232,.14), 0 30px 60px -34px rgba(0,0,0,.8); }
.b-hero img, .b-hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
.yt { appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.yt .play { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(8,18,12,.55); border: 1px solid rgba(242,254,246,.4); box-shadow: inset 0 1px 0 rgba(242,254,246,.35), 0 12px 34px rgba(0,0,0,.45); color: #fff; transition: transform .25s var(--ease), background .2s ease; }
.yt .play .i { width: 26px; height: 26px; margin-left: 3px; fill: currentColor; stroke: none; }
.b-hero .ytlink { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 11px; background: rgba(6,14,10,.72); border: 1px solid rgba(226,244,232,.2); font-size: 13px; font-weight: 500; }
.b-hero .ytlink .i { width: 15px; height: 15px; }
.b-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 18px; }
.b-obj { padding: 20px 18px; }
.b-obj h3, .b-sys-h { font: 700 20px/1.2 var(--disp); }
.b-obj .obj { margin-top: 14px; gap: 11px; }
.b-obj .obj li { font-size: 15.5px; }
.b-act { display: flex; flex-direction: column; gap: 10px; align-self: start; }
.b-act .btn { width: 100%; box-sizing: border-box; }
.b-sys-h { margin-top: 44px; font-size: 26px; }
.sys { margin-top: 18px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.sys h4 { font: 700 21px/1.2 var(--disp); }
.sys p { margin-top: 10px; max-width: 64ch; font-size: 15.5px; line-height: 1.7; color: var(--ink-2); white-space: pre-line; text-wrap: pretty; }
.sys .btn { margin-top: 16px; }
.b-next { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 34px; padding: 18px; font: 700 20px/1.25 var(--disp); }
.b-next span { font-weight: 500; font-family: var(--sans); font-size: 17px; color: var(--ink-2); }
.b-next .i { width: 22px; height: 22px; color: var(--acc); }
.b-cta { margin-top: 16px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.b-cta p { font: 600 18px/1.4 var(--disp); max-width: 40ch; text-wrap: balance; }

/* Objectives check in, one after another, when a brief opens: the build's one authored moment. */
@media (prefers-reduced-motion: no-preference) {
  .brief .b-obj .ck path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tick .42s var(--ease) forwards; animation-delay: calc(260ms + var(--i) * 120ms); }
  .brief .b-obj .ck circle { animation: ring .5s var(--ease) both; animation-delay: calc(200ms + var(--i) * 120ms); }
  .brief .b-obj li span { animation: lit .5s ease both; animation-delay: calc(240ms + var(--i) * 120ms); }
}
@keyframes tick { to { stroke-dashoffset: 0; } }
@keyframes ring { from { stroke: rgba(198,228,208,.1); } }
@keyframes lit { from { opacity: .45; } }

/* Media viewer (inline and big screen share the markup) */
.mv { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage-box { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #070b09; box-shadow: inset 0 0 0 1px rgba(226,244,232,.12); }
.media { position: absolute; inset: 0; }
.media > * { width: 100%; height: 100%; object-fit: cover; }
.veil { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: #05080b; opacity: 0; transition: opacity .17s ease; }
.veil.on { opacity: 1; }
.ctl { position: absolute; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 6px; appearance: none; border: 1px solid rgba(226,244,232,.28); border-radius: 999px; background: rgba(6,12,9,.66); box-shadow: inset 0 1px 0 rgba(242,254,246,.2); color: #f2f8f4; cursor: pointer; transition: background .2s ease; }
.ctl.prev, .ctl.next { top: 50%; width: 44px; height: 44px; margin-top: -22px; }
.ctl.prev { left: 8px; } .ctl.next { right: 8px; }
.ctl.big { top: 8px; right: 8px; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; }
.ctl.big .i { width: 15px; height: 15px; }
.counter { position: absolute; left: 50%; bottom: 8px; z-index: 3; transform: translateX(-50%); padding: 4px 10px; border-radius: 999px; background: rgba(6,12,9,.66); font: 400 12px var(--mono); color: var(--ink-2); pointer-events: none; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }

/* Overlays */
dialog.ov { position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 12px; border: 0; box-sizing: border-box; color: var(--ink); background: rgba(3,7,5,.94); overscroll-behavior: contain; }

#theater[open] { display: flex; align-items: center; justify-content: center; }

#theater .stage-box { max-height: 78vh; max-height: 78dvh; margin: 0 auto; }

/* View transition: the quest cover grows into the brief's hero. */

/* Pointer-only states: touch screens get no sticky hover. */

}

<script>
(() => {
'use strict';
const S = window.SITE;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const html = document.documentElement, main = $('#main');

const mqWide = matchMedia('(min-width: 1024px)');

/* Media: data holds bare names from assets/; the page reads the web copies. */
const stem = (f) => f.replace(/\.[^.]+$/, '');
const isVid = (f) => /\.mp4$/i.test(f);
const pic = (f, w) => 'assets/web/' + stem(f) + '-' + w + '.webp';

const ICONS = {
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/>',
  down: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  left: '<path d="m15 5-7 7 7 7"/>',
  right: '<path d="m9 5 7 7-7 7"/>',
  arrow: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
  expand: '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>',

  graph: '<rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h3a2 2 0 0 1 2 2v5"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  systems: '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>'
};
const icon = (n) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>';
const CHECK = '<svg class="ck" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.6"/><path pathLength="1" d="m6.2 10.3 2.6 2.6 5-5.4"/></svg>';

const projects = S.projects.slice().sort((a, b) => a.slot.localeCompare(b.slot));
projects.forEach((p) => { p.id = slug(p.name); });
const quests = projects.filter((p) => p.cover);
const lockedQ = projects.filter((p) => !p.cover);
const byId = (id) => quests.find((p) => p.id === id);
const metaOf = (p, k) => { const m = (p.meta || []).find((x) => x[0] === k); return m ? m[1] : ''; };
const SECTIONS = ['quests', 'skills', 'contact'];
const MAIL = 'mailto:' + S.email + '?subject=' + encodeURIComponent('Hello Erik');

const st = {
  lang: store('et-lang') === 'hu' ? 'hu' : 'en',
  view: null, id: null, sec: 'quests', mi: {}, th: null,
  homeY: 0, fromHome: false, hue: {}, draft: { name: '', email: '', text: '' }, sent: null
};
const t = (s) => (st.lang === 'hu' && Object.prototype.hasOwnProperty.call(S.hu, s) ? S.hu[s] : s);
const tt = (s) => esc(t(s));

let sfx = null;
function select() {
  try {
    if (!sfx) { sfx = new Audio('assets/ui-select.wav'); sfx.preload = 'auto'; }

    const r = sfx.play(); if (r && r.catch) r.catch(() => {});

}

/* ---------- chrome: section strip, character panel, footer ---------- */
function paintChrome() {
  $('#strip').innerHTML = SECTIONS.map((s) => '<a class="tab" href="#' + s + '" data-sec="' + s + '" data-sfx>' + tt(s[0].toUpperCase() + s.slice(1)) + '</a>').join('') +
    '<a class="mail" href="' + MAIL + '" aria-label="' + tt('Email me') + '">' + icon('mail') + '</a>';

  $('#char').innerHTML =
    '<div class="pf"><img src="assets/web/portrait-400.webp" srcset="' + set('portrait.jpg', [400, 800]) + '" sizes="(min-width: 1024px) 310px, 88px" alt="Erik Thomas" width="400" height="600" fetchpriority="high" decoding="async"></div>' +

    '<nav class="menu" aria-label="' + tt('Menu') + '">' + SECTIONS.map((s) => '<a href="#' + s + '" data-sec="' + s + '" data-sfx><span>' + tt(s === 'quests' ? 'Quest log' : s[0].toUpperCase() + s.slice(1)) + '</span>' + (s === 'quests' ? '<span class="num">' + quests.length + '</span>' : '') + '</a>').join('') + '</nav>' +

  $$('[data-sec]').forEach((a) => a.setAttribute('aria-current', String(st.view === 'home' && a.dataset.sec === st.sec)));
}

/* ---------- home: quest log, skills, contact ---------- */
function questRow(p) {
  const team = metaOf(p, 'Team'), dur = metaOf(p, 'Duration');

    '</div>' +
  '</article>';

function vHome() {
  const d = st.draft, sent = st.sent || {}, cv = st.lang === 'hu' ? S.cv.hu : S.cv.en;
  return '<section class="sec" id="quests" aria-labelledby="h-q">' +

    '</section>' +
    '<section class="sec" id="skills" aria-labelledby="h-s">' +
      '<div class="sec-head"><h2 class="h" id="h-s">' + tt('Skills') + '</h2></div>' +

    '</section>' +

      '<div class="mail-row"><a class="btn solid" href="' + MAIL + '">' + icon('mail') + '<span class="addr">' + esc(S.email) + '</span></a>' +

        '<span class="copied" role="status" aria-live="polite"></span></div>' +
      '<div class="links">' + S.links.map(([k, v, href]) => '<a href="' + href + '" target="_blank" rel="noopener noreferrer"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span>' + icon('ext') + '</a>').join('') +

      '<form class="fb glass" id="fb" novalidate>' +

function mediaList(sys) {

function mediaEl(m, big) {

/* ---------- accent + backdrop ---------- */
function accent(p) {
  html.classList.toggle('in-quest', !!p);
  if (!p) { html.style.setProperty('--h', 145); html.style.setProperty('--s', 20); return; }
  $('#bgCover').style.backgroundImage = 'url("' + pic(p.cover, 'bg') + '")';
  const apply = (v) => { if (st.id === p.id) { html.style.setProperty('--h', v.h); html.style.setProperty('--s', v.s); } };
  if (st.hue[p.cover]) return apply(st.hue[p.cover]);
  const im = new Image();
  im.onload = () => {
    let v = { h: 145, s: 20 };
    try {
      const n = 24, c = document.createElement('canvas'); c.width = c.height = n;
      const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, n, n);
      const d = ctx.getImageData(0, 0, n, n).data;
      let x = 0, y = 0, sw = 0, ss = 0, sc = 0;
      for (let k = 0; k < d.length; k += 4) {
        const r = d[k] / 255, g = d[k + 1] / 255, b = d[k + 2] / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
        if (mx === mn || l < .06 || l > .97) continue;
        const dl = mx - mn, sat = l > .5 ? dl / (2 - mx - mn) : dl / (mx + mn);
        let h = mx === r ? (g - b) / dl + (g < b ? 6 : 0) : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
        h *= 60;
        const w = sat * (1 - Math.abs(l - .5) * 1.2);
        x += Math.cos(h * Math.PI / 180) * w; y += Math.sin(h * Math.PI / 180) * w;
        sw += w; ss += sat; sc++;
      }
      if (sc && sw) {
        let h = Math.atan2(y, x) * 180 / Math.PI; if (h < 0) h += 360;
        v = { h: Math.round(h), s: Math.max(14, Math.min(34, Math.round((ss / sc) * 100 * .8))) };
      }
    } catch (e) {}
    st.hue[p.cover] = v; apply(v);
  };
  im.src = pic(p.cover, 400);
}

/* ---------- clips: only the ones on screen load and run ---------- */
const openDlg = () => $('dialog.ov[open]');
const play = (v) => { const r = v.play(); if (r && r.catch) r.catch(() => {}); };
const playLoud = (v) => { const r = v.play(); if (r && r.catch) r.catch(() => { v.muted = true; play(v); }); };
const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  const v = en.target;
  if (!en.isIntersecting) { if (!v.paused) v.pause(); return; }
  if (!v.getAttribute('src')) v.src = v.dataset.src;
  if (!openDlg() && !v.dataset.paused) play(v);
}), { threshold: 0.25 });
const unload = (v) => { io.unobserve(v); v.removeAttribute('src'); v.load(); };
function resumeVisible() {
  $$('video[data-src]', main).forEach((v) => {
    const r = v.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight && !v.dataset.paused && v.getAttribute('src')) play(v);
  });
}

function showMedia(i, n) {
  const p = byId(st.id); if (!p) return;
  const list = mediaList(p.systems[i]);
  n = ((n % list.length) + list.length) % list.length;
  if (n === (st.mi[i] || 0)) return;
  st.mi[i] = n;
  const boxes = [$('.mv[data-sys="' + i + '"]', main)];
  if (st.th === i) boxes.push($('#thMv'));
  boxes.forEach((box) => {
    if (!box) return;
    const big = box.id === 'thMv', veil = $('.veil', box), media = $('.media', box);
    $$('.thumbs button', box).forEach((b, k) => b.setAttribute('aria-current', String(k === n)));
    const c = $('.counter', box); if (c) c.textContent = (n + 1) + ' / ' + list.length;
    veil.classList.add('on');
    clearTimeout(box._swap); clearTimeout(box._lift);
    box._swap = setTimeout(() => {
      const old = $('video', media); if (old) unload(old);
      media.innerHTML = mediaEl(list[n], big);
      const el = media.firstElementChild;
      const lift = () => { clearTimeout(box._lift); veil.classList.remove('on'); };
      box._lift = setTimeout(lift, 1400);
      if (el.tagName === 'VIDEO') {
        el.addEventListener('loadeddata', lift, { once: true }); el.addEventListener('error', lift, { once: true });
        if (big) playLoud(el); else io.observe(el);
      } else if (el.complete) lift();
      else { el.addEventListener('load', lift, { once: true }); el.addEventListener('error', lift, { once: true }); }
    }, 170);
  });
}

/* ---------- overlays: history-aware, so the phone's back gesture closes them ---------- */
function openOverlay(d) {

$$('dialog.ov').forEach((d) => d.addEventListener('cancel', (e) => { e.preventDefault(); closeOverlay(); }));

/* ---------- routing ---------- */
function parse() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const m = h.match(/^(?:quest|inventory)\/(.+)$/);
  if (m && byId(m[1])) return { view: 'brief', id: m[1] };
  return { view: 'home', id: null, sec: SECTIONS.indexOf(h) >= 0 ? h : null };
}

let spy = null;
function watchSections() {
  if (spy) spy.disconnect();
  spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { st.sec = e.target.id; markSection(); } });
  }, { rootMargin: '-35% 0px -60% 0px' });
  $$('.sec', main).forEach((s) => spy.observe(s));
}

function render(r) {
  $$('video', main).forEach(unload);
  if (r.view === 'brief') {
    const p = byId(r.id);
    if (st.id !== r.id) st.mi = {};
    st.view = 'brief'; st.id = r.id;
    main.innerHTML = vBrief(p);
    accent(p);
    if (spy) spy.disconnect();
  } else {
    st.view = 'home'; st.id = null;
    main.innerHTML = vHome();
    accent(null);
    watchSections();
  }
  $$('video[data-src]', main).forEach((v) => io.observe(v));
  markSection();
}

/* Route changes jump; html's smooth scroll is for in-page section links only. */
const jump = (y) => scrollTo({ top: y, behavior: 'instant' });

/* The quest's cover and the brief's hero share one view-transition name, so the
   cover grows into place where the browser supports it; elsewhere it's a plain swap. */
function navigate(r, first) {
  if (openDlg()) closeOverlay(true);
  const was = { view: st.view, id: st.id };
  if (was.view === r.view && was.id === r.id && r.view === 'home') {
    if (r.sec) { const el = document.getElementById(r.sec); if (el) el.scrollIntoView(); }
    return;
  }
  if (was.view === 'home') st.homeY = scrollY;
  st.fromHome = r.view === 'brief' && was.view === 'home';
  const update = () => {
    render(r);
    if (r.view === 'brief') { jump(0); $('.vt-cover', main) && ($('.vt-cover', main).style.viewTransitionName = 'cover'); }
    else if (r.sec && !(was.view === 'brief' && r.sec === 'quests' && st.homeY)) { const el = document.getElementById(r.sec); if (el) el.scrollIntoView({ behavior: 'instant' }); }
    else { jump(was.view === 'brief' ? st.homeY : 0); if (was.id) { const im = $('.quest[data-id="' + was.id + '"] .q-thumb img', main); if (im) im.style.viewTransitionName = 'cover'; } }
    if (!first) main.focus({ preventScroll: true });
  };
  if (first || reduced || !document.startViewTransition) { update(); return; }
  const src = r.view === 'brief' ? $('.quest[data-id="' + r.id + '"] .q-thumb img', main) : $('.vt-cover', main);
  if (src) src.style.viewTransitionName = 'cover';
  const vt = document.startViewTransition(update);
  vt.finished.finally(() => $$('[style*="view-transition-name"]', main).forEach((el) => { el.style.viewTransitionName = ''; }));
}
addEventListener('hashchange', () => navigate(parse()));

/* ---------- language ---------- */
const GLYPHS = 'ÁÉÍÓÖŐÚÜŰ#%&@$*+=<>/\\|01░▒';
function glitch(s, p) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === ' ' || c === '\n' || c === '—') { out += c; continue; }
    const h = ((i * 2654435761) % 1000) / 1000;
    out += p > (i / s.length) * 0.72 + h * 0.28 ? c : GLYPHS[(i * 7 + Math.floor(p * 97) * 13 + Math.floor(h * 1000)) % GLYPHS.length];
  }
  return out;
}
/* The new language is in place from frame one; each character stays masked by a
   glyph until its own threshold passes, like a menu re-localising itself. */
let decodeT = 0;
function decode() {
  if (reduced) return;
  const root = $('#app'), nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.data.trim() && !n.parentNode.closest('.lang, .num, kbd') ? 1 : 3) });
  for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push([n, n.data]);
  let step = 0;
  const frame = () => {
    const p = step / 6;
    nodes.forEach(([n, s]) => { n.data = p >= 1 ? s : glitch(s, p); });
    if (p >= 1) clearInterval(decodeT);
    step++;
  };
  clearInterval(decodeT); frame();
  decodeT = setInterval(frame, 26);
}
function setLang(l) {
  if (l === st.lang) return;
  st.lang = l; store('et-lang', l); html.lang = l;
  const y = scrollY;
  paintChrome(); render({ view: st.view, id: st.id }); jump(y);
  decode();
}

/* ---------- contact ---------- */
function copyEmail() {
  const done = () => {
    const c = $('.copied', main); if (!c) return;
    c.textContent = t('Copied'); c.classList.add('on');
    clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove('on'), 2200);
  };
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = S.email; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    } catch (e) {}

  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.email).then(done, legacy);
  else legacy();
}
let fbT = 0;
function fbStatus(form, msg, err) {
  const el = $('.status', form);
  el.textContent = msg ? t(msg) : ''; el.classList.toggle('err', !!err);
  clearTimeout(fbT);
  if (msg && !err && msg !== 'Sending…') fbT = setTimeout(() => { el.textContent = ''; }, 5000);
}
async function sendFeedback(form) {
  const d = st.draft, text = d.text.trim(), btn = $('button[type=submit]', form), F = (k) => form.elements.namedItem(k);
  if (!text) { fbStatus(form, 'Write something first.', true); F('text').focus(); return; }
  const entry = { at: new Date().toISOString(), name: d.name.trim() || null, email: d.email.trim() || null, text, lang: st.lang };
  btn.disabled = true; fbStatus(form, 'Sending…');
  try {
    /* Apps Script answers without CORS headers, so this is fire-and-forget:
       a resolved fetch means it left the browser; only a network error rejects. */
    if (!F('website').value) {
      await fetch(S.feedbackEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(entry) });
    }
    st.sent = entry; st.draft = { name: '', email: '', text: '' };
    ['name', 'email', 'text'].forEach((k) => { F(k).value = ''; });
    F('name').placeholder = entry.name || t('Your name (optional)');
    F('email').placeholder = entry.email || t('Email for a reply (optional)');
    F('text').placeholder = text;
    fbStatus(form, 'Thanks, your note is logged.');
  } catch (e) {
    fbStatus(form, 'Couldn’t send. Please email me instead.', true);
  } finally { btn.disabled = false; }
}
main.addEventListener('input', (e) => {
  const f = e.target;

});

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-sfx]')) select();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const i = +el.dataset.sys;
  switch (el.dataset.act) {
    case 'lang': select(); setLang(el.dataset.lang); break;
    case 'back': if (st.fromHome) { e.preventDefault(); history.back(); } break;
    case 'step': showMedia(i, (st.mi[i] || 0) + +el.dataset.d); break;
    case 'pick': showMedia(i, +el.dataset.n); break;
    case 'theater': openTheater(i); break;
    case 'bp': openBlueprint(i); break;
    case 'close': closeOverlay(); break;
    case 'copy': copyEmail(); break;
    case 'toggle':
      if (el.paused) { delete el.dataset.paused; play(el); } else { el.dataset.paused = '1'; el.pause(); }
      break;
    case 'yt': {
      const p = byId(st.id);
      if (location.protocol === 'file:') { open('https://youtu.be/' + p.youtube, '_blank', 'noopener'); break; }
      el.outerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + p.youtube + '?rel=0&modestbranding=1&playsinline=1&autoplay=1" title="' + tt('Gameplay capture') + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      break;
    }
  }
});

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target;
  if (tg && (tg.isContentEditable || /^(input|textarea|select)$/i.test(tg.tagName))) return;
  if ($('#theater').open && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { showMedia(st.th, (st.mi[st.th] || 0) + (e.key === 'ArrowLeft' ? -1 : 1)); return; }
  if (openDlg()) return;
  if (e.key === 'Escape' && st.view === 'brief') { $('.back', main).click(); return; }
  const k = e.key && e.key.toLowerCase();
  if (k !== 'e' && k !== 'q') return;
  const cur = st.view === 'home' ? SECTIONS.indexOf(st.sec) : -1;
  const next = SECTIONS[(cur + (k === 'e' ? 1 : SECTIONS.length - (cur < 0 ? 0 : 1))) % SECTIONS.length];
  select();
  if (location.hash === '#' + next) navigate({ view: 'home', id: null, sec: next }); else location.hash = '#' + next;
});
