<style>
/* Accent colours follow the open project's cover hue (--h/--s, set from JS);
   outside a case study they sit on the base pine, 145/20. */
:root {
  --h: 145; --s: 20;
  --acc: hsl(var(--h), calc((var(--s) + 8) * 1%), 63%);
  --acc-dim: hsla(var(--h), calc((var(--s) + 6) * 1%), 66%, .82);
  --glow: hsla(var(--h), calc((var(--s) + 8) * 1%), 62%, .85);
  --line: hsla(var(--h), calc((var(--s) + 18) * 1%), 88%, .15);
  --card: hsla(var(--h), calc((var(--s) + 30) * 1%), 93%, .05);
  --btn-bd: hsla(var(--h), calc((var(--s) + 20) * 1%), 79%, .44);
  --btn-bd-hi: hsla(var(--h), calc((var(--s) + 20) * 1%), 79%, .72);
  --head: hsl(var(--h), calc((var(--s) - 2) * 1%), 96%);
  --body: hsla(var(--h), calc((var(--s) - 4) * 1%), 90%, .72);
  --muted: hsla(var(--h), calc((var(--s) - 6) * 1%), 87%, .64);
  --dl-bg: hsla(var(--h), calc((var(--s) + 26) * 1%), 64%, .95);
  --dl-bg-hi: hsl(var(--h), calc((var(--s) + 26) * 1%), 71%);
  --dl-fg: hsl(var(--h), calc((var(--s) + 34) * 1%), 11%);
  --dl-shadow: hsla(var(--h), calc((var(--s) + 20) * 1%), 50%, .3);
  --tint: hsla(var(--h), calc((var(--s) + 26) * 1%), 26%, .16);
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --disp: 'Archivo', system-ui, sans-serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --stick: 0px;
}
html, body { margin: 0; padding: 0; background: #09130d; }
body { font-family: var(--sans); color: #dbe8de; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
a { color: #b9d8c4; text-decoration: none; }
button { font: inherit; color: inherit; }
img, video { display: block; }
::selection { background: rgba(122,168,138,.35); }
:focus-visible { outline: 2px solid #9fd0b0; outline-offset: 3px; border-radius: 10px; }
button:focus-visible { outline-offset: -2px; }
input:focus-visible, textarea:focus-visible { outline-offset: 1px; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(178,214,190,.22); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
* { scrollbar-width: thin; scrollbar-color: rgba(178,214,190,.28) transparent; }
.lbl { font: 9.5px var(--mono); letter-spacing: .28em; color: #7aa88a; text-transform: uppercase; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes drift { 0%, 100% { transform: scale(1.08) translate3d(0,0,0); } 50% { transform: scale(1.14) translate3d(-1.5%,-1%,0); } }
@keyframes panelIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@keyframes lineIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes tabFlash { 0%, 100% { opacity: .12; } 50% { opacity: .55; } }
@keyframes subFlash { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }

/* Backdrop. The images are pre-blurred by tools/optimize-media.py, so nothing
   here runs a CSS blur; only the transform drifts, and only on desktop. */
.bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.bg > div { position: absolute; inset: 0; }
.bg .img { inset: -6%; background: center / cover no-repeat; }
.bg .base { background-image: url(assets/web/backdrop-bg.webp); }
.bg .cover, .bg .cold { opacity: 0; transition: opacity .6s ease; }
.bg .vig { background: radial-gradient(120% 90% at 50% 40%, rgba(12,32,22,.2) 0%, rgba(5,16,11,.7) 80%); }
.bg .warm { background: rgba(30,84,58,.14); mix-blend-mode: soft-light; transition: opacity .6s ease; }
.bg .cold { background: var(--tint); mix-blend-mode: soft-light; }
.is-cold .bg .cover, .is-cold .bg .cold { opacity: 1; }
.is-cold .bg .warm { opacity: 0; }

/* Shell */
.stage { position: relative; height: 100vh; height: 100dvh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 28px; box-sizing: border-box; }
.shell {
  position: relative; width: 100%; max-width: 1360px;
  height: min(860px, calc(100vh - 56px)); height: min(860px, calc(100dvh - 56px));
  border-radius: 34px; border: 1px solid rgba(226,244,232,.17); box-sizing: border-box;
  background: linear-gradient(158deg, rgba(236,248,240,.07) 0%, rgba(210,232,218,.035) 46%, rgba(6,14,10,.14) 100%);
  -webkit-backdrop-filter: blur(42px) saturate(2.3) brightness(1.04); backdrop-filter: blur(42px) saturate(2.3) brightness(1.04);
  box-shadow: 0 44px 130px rgba(0,0,0,.5), 0 2px 12px rgba(0,0,0,.26), 0 0 0 .5px rgba(226,244,232,.16), inset 0 1px 0 rgba(242,254,246,.36), inset 0 -1px 0 rgba(200,226,210,.09), inset 0 -40px 70px -50px rgba(0,0,0,.42);
  display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  animation: panelIn .7s cubic-bezier(.2,.7,.25,1) backwards;
  transition: max-width .34s cubic-bezier(.25,.8,.3,1), height .34s cubic-bezier(.25,.8,.3,1);
}
.shell::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(158deg, rgba(196,220,255,.06) 0%, rgba(150,180,225,.03) 46%, rgba(6,10,20,.16) 100%); opacity: 0; transition: opacity .6s ease; }
.is-cold .shell::before { opacity: 1; }
.is-detail .shell { max-width: max(1360px, 92vw); height: max(min(860px, calc(100vh - 56px)), min(92vh, calc(100vh - 24px))); height: max(min(860px, calc(100dvh - 56px)), min(92dvh, calc(100dvh - 24px))); }

/* Header */
.head { position: relative; z-index: 6; display: flex; align-items: stretch; justify-content: space-between; gap: 24px; padding: 0 22px; max-height: 124px; overflow: hidden; background: linear-gradient(180deg, rgba(240,250,244,.085) 0%, rgba(240,250,244,.02) 100%); box-shadow: inset 0 1px 0 rgba(242,254,246,.24), 0 16px 30px -24px rgba(0,0,0,.6); border-bottom: 1px solid rgba(198,228,208,.15); transition: max-height .32s cubic-bezier(.25,.8,.3,1), opacity .22s ease, border-color .22s ease; }
.is-detail .head { max-height: 0; opacity: 0; pointer-events: none; border-bottom-color: transparent; visibility: hidden; transition: max-height .32s cubic-bezier(.25,.8,.3,1), opacity .22s ease, visibility 0s .32s; }
.brand { display: flex; flex-direction: column; justify-content: center; padding: 18px 0; min-width: 0; border-radius: 10px; color: inherit; transition: opacity .2s ease; }
.brand h1 { margin: 0; font: 800 23px/1 var(--disp); letter-spacing: .16em; white-space: nowrap; }
.brand .role { font: 10.5px/1.35 var(--mono); letter-spacing: .28em; text-transform: uppercase; color: var(--acc); margin-top: 8px; }
.head-r { display: flex; align-items: stretch; }
.tabs { position: relative; display: flex; align-items: stretch; gap: 2px; }
.tabs .bar { position: absolute; bottom: -1px; left: 0; width: 0; height: 2px; background: var(--acc); box-shadow: 0 0 10px var(--glow); opacity: 0; transition: transform .42s cubic-bezier(.22,.9,.24,1), width .42s cubic-bezier(.22,.9,.24,1), opacity .25s ease; }
.tab { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 20px; border-radius: 12px; color: rgba(197,221,205,.72); transition: background-color .3s ease, color .25s ease; }
.tab .t { font: 600 12.5px var(--disp); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.tab[aria-current="page"] { color: #f2f8f4; }
.tab .sub { position: absolute; top: calc(50% + 9px); left: 0; right: 0; text-align: center; font: 8.5px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--acc-dim); }
.tab.flash .sub { color: #7aa88a; animation: subFlash 2.6s ease-in-out infinite; }
.tab.flash::after { content: ''; position: absolute; inset: 0; border-radius: 12px; pointer-events: none; background: rgba(150,200,168,.2); animation: tabFlash 2.6s ease-in-out infinite; }
.lang { display: flex; align-items: center; padding-left: 14px; flex: none; }
.lang-pill { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid rgba(198,228,208,.22); background: rgba(18,32,24,.42); box-shadow: inset 0 1px 0 rgba(242,254,246,.16); }
.lang button { appearance: none; border: 0; cursor: pointer; font: 500 9.5px var(--mono); letter-spacing: .16em; padding: 6px 10px; border-radius: 999px; background: transparent; color: rgba(197,221,205,.6); transition: background .22s ease, color .22s ease; }
.lang button[aria-pressed="true"] { background: rgba(150,200,168,.28); color: #f2f8f4; }

/* View + swap transition */
.view { position: relative; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-bottom: 22px; transition: opacity .3s ease, filter .34s cubic-bezier(.3,.7,.3,1), transform .34s cubic-bezier(.3,.7,.3,1); }
.view.out { opacity: 0; filter: blur(14px); transform: scale(1.012); }
.view:focus { outline: none; }

/* Status */
.v-status { padding: 36px 40px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 44px; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.portrait { position: relative; aspect-ratio: 3/4; border-radius: 22px; border: 1px solid rgba(198,228,208,.2); box-shadow: inset 0 1px 0 rgba(226,244,232,.16); background: radial-gradient(120% 100% at 45% 35%, #2c5c41 0%, #1b3a29 55%, #112418 100%); display: flex; align-items: flex-end; padding: 14px; overflow: hidden; }
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; transform: scale(1.08); transform-origin: 50% 26%; }
.portrait::before, .portrait::after { content: ''; position: absolute; width: 14px; height: 14px; z-index: 3; }
.portrait::before { top: 10px; left: 10px; border-top: 1px solid rgba(122,168,138,.8); border-left: 1px solid rgba(122,168,138,.8); }
.portrait::after { bottom: 10px; right: 10px; border-bottom: 1px solid rgba(122,168,138,.8); border-right: 1px solid rgba(122,168,138,.8); }
.portrait .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,26,19,0) 0%, rgba(14,26,19,.04) 50%, rgba(14,26,19,.55) 100%); }
.portrait .ring { position: absolute; inset: -1px; border-radius: 22px; background: radial-gradient(115% 105% at 50% 42%, rgba(30,48,38,0) 42%, rgba(30,48,38,.34) 74%, rgba(26,44,34,.72) 100%); }
.portrait .cap { position: relative; font: 10px var(--mono); letter-spacing: .2em; color: rgba(226,244,232,.82); }
.fade { opacity: 0; transition: opacity .5s ease; }
.fade.in { opacity: 1; }
.cells { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(198,228,208,.14); border: 1px solid rgba(198,228,208,.16); border-radius: 18px; overflow: hidden; }
.cells > div { background: rgba(28,44,36,.30); padding: 12px 13px; min-width: 0; }
.cells .k { font: 9px var(--mono); letter-spacing: .2em; color: rgba(197,221,205,.62); text-transform: uppercase; }
.cells .v { font: 600 13px var(--disp); margin-top: 6px; color: #e2ede5; }
.lead { font: 500 26px/1.4 var(--disp); letter-spacing: -.01em; margin: 14px 0 0; text-wrap: pretty; color: #eaf2ec; }
.intro { font-size: 15px; line-height: 1.75; color: rgba(217,230,221,.72); margin: 18px 0 0; text-wrap: pretty; }
.focus { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(198,228,208,.13); border: 1px solid rgba(198,228,208,.15); border-radius: 18px; overflow: hidden; }
.focus > div { background: rgba(28,44,36,.26); padding: 18px 20px; }
.focus .k { font: 700 13px var(--disp); letter-spacing: .12em; text-transform: uppercase; color: #b9d8c4; }
.focus .v { font-size: 13.5px; line-height: 1.6; color: rgba(217,230,221,.66); margin-top: 8px; }
.feat { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 16px; border-radius: 20px; border: 1px solid rgba(198,228,208,.18); background: rgba(30,48,38,.26); box-shadow: inset 0 1px 0 rgba(226,244,232,.14); color: inherit; transition: transform .28s cubic-bezier(.2,.7,.25,1), border-color .28s ease, background .28s ease; }
.feat .thumb { position: relative; flex: 1 1 190px; max-width: 190px; min-width: 150px; aspect-ratio: 16/10; border-radius: 14px; overflow: hidden; border: 1px solid rgba(198,228,208,.16); background: #1b3a29; }
.feat .thumb img, .card .cov img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
.badge { position: absolute; top: 8px; left: 9px; z-index: 2; padding: 2px 6px; border-radius: 6px; background: rgba(8,16,11,.62); box-shadow: inset 0 1px 0 rgba(242,254,246,.2); font: 9px var(--mono); letter-spacing: .16em; color: rgba(190,222,202,.95); }
.feat .txt { flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.feat .name { font: 700 17px var(--disp); letter-spacing: .05em; color: #eaf3ec; }
.feat .blurb { font-size: 13.5px; line-height: 1.55; color: rgba(217,230,221,.66); }
.feat .row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 2px; }
.feat .open { font: 10px var(--mono); letter-spacing: .18em; color: #7aa88a; margin-left: auto; white-space: nowrap; }
.chip { font: 10px var(--mono); letter-spacing: .1em; padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(198,228,208,.2); background: rgba(122,168,138,.08); color: rgba(197,221,205,.7); }

/* Skills */
.v-skills { padding: 34px 40px 44px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.branch .top { border: 1px solid rgba(var(--c), .42); background: rgba(var(--c), .16); box-shadow: inset 0 1px 0 rgba(240,250,244,.2), 0 0 22px rgba(var(--c), .16); border-radius: 16px; padding: 13px 14px 12px; }
.branch .title { font: 700 12.5px var(--disp); letter-spacing: .13em; text-transform: uppercase; color: rgb(var(--soft)); text-wrap: pretty; }
.branch .note { font: 9px var(--mono); letter-spacing: .15em; color: rgba(197,221,205,.62); margin-top: 6px; text-transform: uppercase; }
.branch .stem { width: 1px; height: 14px; margin-left: 22px; background: rgba(var(--c), .34); }
.branch ul { position: relative; list-style: none; margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 7px; }
.branch ul::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 13px; width: 1px; background: rgba(var(--c), .34); }
.branch li { position: relative; display: flex; }
.branch li::before { content: ''; position: absolute; left: -22px; top: 50%; width: 15px; height: 1px; background: rgba(var(--c), .34); }
.branch li::after { content: ''; position: absolute; left: -9px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 1px; transform: rotate(45deg); background: rgba(var(--c), .55); }
.branch li span { flex: 1; font: 12.5px var(--mono); letter-spacing: .06em; padding: 12px 13px; border-radius: 11px; border: 1px solid rgba(198,228,208,.16); background: rgba(var(--c), .09); box-shadow: inset 0 1px 0 rgba(226,244,232,.1); color: #cadecf; transition: filter .2s ease, border-color .2s ease; }

/* Inventory grid */
.v-grid { padding: 32px 40px 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card { position: relative; border: 1px solid rgba(198,228,208,.18); background: rgba(30,48,38,.34); box-shadow: inset 0 1px 0 rgba(240,252,244,.16), 0 12px 30px -24px rgba(0,0,0,.8); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; color: inherit; transition: transform .28s cubic-bezier(.2,.7,.25,1), border-color .28s ease, background .28s ease; }
.card.locked { opacity: .55; cursor: default; }
.card .cov { position: relative; aspect-ratio: 16/10; background: repeating-linear-gradient(135deg, rgba(214,236,222,.05) 0 9px, rgba(214,236,222,0) 9px 18px); border-bottom: 1px solid rgba(198,228,208,.14); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.card .has { background: radial-gradient(120% 100% at 45% 35%, #2c5c41 0%, #1b3a29 55%, #112418 100%); }
.card .soon { font: 9.5px var(--mono); letter-spacing: .2em; color: rgba(197,221,205,.62); }
.card .badge { top: 9px; left: 10px; font-size: 9.5px; color: rgba(178,214,190,.95); }
.card .txt { padding: 14px 15px 16px; display: flex; flex-direction: column; gap: 9px; }
.card .name { display: flex; align-items: center; gap: 8px; font: 700 15.5px var(--disp); letter-spacing: .06em; color: #e8f1ea; }
.dl-ico { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; flex: none; border-radius: 6px; border: 1px solid rgba(160,206,176,.4); background: rgba(140,192,158,.18); color: #bfe0cc; font-size: 11px; line-height: 1; }
.card .blurb { font-size: 12.5px; line-height: 1.55; color: rgba(217,230,221,.6); }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
.tags .chip { padding: 4px 8px; }

/* Case study */
.v-detail { padding: 26px 40px 44px; }
.backbar { position: sticky; top: 0; z-index: 12; margin: -26px -40px 0; padding: 20px 40px 14px; display: flex; background: linear-gradient(180deg, rgba(8,14,20,.72) 0%, rgba(8,14,20,.46) 62%, rgba(8,14,20,0) 100%); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); }
.back { appearance: none; cursor: pointer; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.9); box-shadow: 0 4px 18px rgba(0,0,0,.35); color: #101820; font: 500 10px var(--mono); letter-spacing: .2em; padding: 10px 17px; transition: all .2s ease; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 40px; margin-top: 24px; align-items: start; }
.hero { position: relative; aspect-ratio: 16/9; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(226,244,232,.16); background: var(--card); }
.hero img, .hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
.yt { appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; background: #0a0f0d; }
.yt .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(226,244,232,.34); background: rgba(9,19,13,.55); box-shadow: inset 0 1px 0 rgba(242,254,246,.24), 0 10px 30px rgba(0,0,0,.4); color: #f2f8f4; font-size: 20px; padding-left: 4px; box-sizing: border-box; transition: transform .2s ease, background .2s ease; }
.hero .ytlink { position: absolute; right: 12px; bottom: 12px; z-index: 2; font: 9px var(--mono); letter-spacing: .2em; text-transform: uppercase; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(9,19,13,.62); box-shadow: inset 0 1px 0 rgba(242,254,246,.2); color: rgba(226,244,232,.8); }
.info { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.kicker { font: 9.5px var(--mono); letter-spacing: .24em; color: var(--acc); }
.ptitle { font: 800 34px/1.1 var(--disp); letter-spacing: -.01em; margin: 10px 0 0; color: var(--head); }
.summary { font-size: 14.5px; line-height: 1.65; color: var(--body); margin: 12px 0 0; text-wrap: pretty; }
.dl { display: inline-flex; align-items: center; gap: 11px; align-self: flex-start; font: 600 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; padding: 15px 24px; border-radius: 999px; background: var(--dl-bg); box-shadow: 0 10px 30px var(--dl-shadow), inset 0 1px 0 rgba(255,255,255,.34); color: var(--dl-fg); transition: background .2s ease, transform .2s ease; }
.dl span:first-child { font-size: 14px; line-height: 1; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }

<script>
(() => {
'use strict';
const S = window.SITE;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const pic = (f, w) => 'assets/web/' + stem(f) + '-' + w + '.webp';
const set = (f, ws) => ws.map((w) => pic(f, w) + ' ' + w + 'w').join(', ');
const clip = (f, hd) => 'assets/web/' + stem(f) + (hd ? '-1080.mp4' : '-720.mp4');

const projects = S.projects.slice().sort((a, b) => a.slot.localeCompare(b.slot));
projects.forEach((p) => { p.id = slug(p.name); });
const byId = (id) => projects.find((p) => p.id === id);

const st = {
  lang: store('et-lang') === 'hu' ? 'hu' : 'en',
  route: { tab: null, id: null },
  mi: {}, invSeen: false, fromGrid: false,
  draft: { name: '', email: '', text: '' }, sent: null,

/* ---------- accent + backdrop ---------- */
function accent(p) {
  const on = !!(p && p.cover);
  html.classList.toggle('is-cold', on);
  if (!on) { html.style.setProperty('--h', 145); html.style.setProperty('--s', 20); return; }
  $('#bgCover').style.backgroundImage = 'url("' + pic(p.cover, 'bg') + '")';
  const apply = (v) => { if (st.route.id === p.id) { html.style.setProperty('--h', v.h); html.style.setProperty('--s', v.s); } };
  if (st.hue[p.cover]) return apply(st.hue[p.cover]);
  const im = new Image();
  im.onload = () => {
    let v = { h: 145, s: 20 };
    try {
      const n = 24, c = document.createElement('canvas'); c.width = c.height = n;
      const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, n, n);
      const d = ctx.getImageData(0, 0, n, n).data;
      let x = 0, y = 0, sw = 0, ss = 0, sc = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
        if (mx === mn || l < .06 || l > .97) continue;
        const dl = mx - mn, sat = l > .5 ? dl / (2 - mx - mn) : dl / (mx + mn);
        let h = mx === r ? (g - b) / dl + (g < b ? 6 : 0) : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
        h *= 60;
        const w = sat * (1 - Math.abs(l - .5) * 1.2);
        x += Math.cos(h * Math.PI / 180) * w; y += Math.sin(h * Math.PI / 180) * w;
        sw += w; ss += sat; sc++;
      }
      if (sc && sw) {
        let h = Math.atan2(y, x) * 180 / Math.PI; if (h < 0) h += 360;
        v = { h: Math.round(h), s: Math.max(14, Math.min(34, Math.round((ss / sc) * 100 * .8))) };
      }
    } catch (e) {}
    st.hue[p.cover] = v; apply(v);
  };
  im.src = pic(p.cover, 400);
}

/* ---------- video playback ---------- */
const theaterOpen = () => $('#theater').open;
const openDlg = () => $('dialog.ov[open]');
const play = (v) => { const r = v.play(); if (r && r.catch) r.catch(() => {}); };
/* A case study holds a clip per system; only the ones on screen load and run. */
const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  const v = en.target;
  if (!en.isIntersecting) { if (!v.paused) v.pause(); return; }
  if (!v.getAttribute('src')) v.src = v.dataset.src;
  if (!openDlg() && !v.dataset.paused) play(v);
}), { threshold: 0.2 });
const watch = (root) => $$('video[data-src]', root).forEach((v) => io.observe(v));
function resumeVisible() {
  const vh = innerHeight;
  $$('video[data-src]', view).forEach((v) => {
    const r = v.getBoundingClientRect();
    if (r.bottom > 0 && r.top < vh && !v.dataset.paused && v.getAttribute('src')) play(v);
  });
}

/* ---------- media switching ---------- */
function showMedia(i, n) {
  const p = byId(st.route.id); if (!p) return;
  const sys = p.systems[i], list = mediaList(sys);
  n = ((n % list.length) + list.length) % list.length;
  if (n === (st.mi[i] || 0)) return;
  st.mi[i] = n;
  const boxes = [$('.mv[data-sys="' + i + '"]', view)];
  if (st.th === i) boxes.push($('#thMv'));
  boxes.forEach((box) => {
    if (!box) return;
    const big = box.id === 'thMv', veil = $('.veil', box), media = $('.media', box);
    $$('.thumbs button', box).forEach((b, k) => b.setAttribute('aria-current', String(k === n)));
    $$('.counter, .th-count', box).forEach((c) => { c.textContent = (n + 1) + ' / ' + list.length; });
    veil.classList.add('on');
    clearTimeout(box._swap); clearTimeout(box._lift);
    box._swap = setTimeout(() => {
      const old = $('video', media); if (old) { io.unobserve(old); old.removeAttribute('src'); old.load(); }
      media.innerHTML = mediaEl(list[n], big);
      const el = media.firstElementChild;
      const lift = () => { clearTimeout(box._lift); veil.classList.remove('on'); };
      box._lift = setTimeout(lift, 1400);
      if (el.tagName === 'VIDEO') {
        el.addEventListener('loadeddata', lift, { once: true });
        el.addEventListener('error', lift, { once: true });
        if (big) playLoud(el); else io.observe(el);
      } else if (el.complete) lift();
      else { el.addEventListener('load', lift, { once: true }); el.addEventListener('error', lift, { once: true }); }
    }, 170);
  });
}

/* Big screen starts with sound when the browser allows it, muted otherwise. */
function playLoud(v) {
  const r = v.play();
  if (r && r.catch) r.catch(() => { v.muted = true; play(v); });
}

/* ---------- overlays (history-aware, so the phone's back gesture closes them) ---------- */
function openOverlay(d) {
  $$('video', view).forEach((v) => { if (!v.paused) v.pause(); });
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  html.classList.add('ov-open');
  history.pushState({ ov: 1 }, '');
}
function closeOverlay(fromPop) {
  const d = openDlg(); if (!d) return;
  if (!fromPop && history.state && history.state.ov) { history.back(); return; }
  if (d.close) d.close(); else d.removeAttribute('open');
  html.classList.remove('ov-open');
  if (d.id === 'theater') { const v = $('video', d); if (v) { v.pause(); v.removeAttribute('src'); v.load(); } $('#thMv').innerHTML = ''; st.th = null; }
  if (d.id === 'bp') { const f = $('#bpFrame'); if (f) f.remove(); }
  resumeVisible();
}
addEventListener('popstate', () => { if (openDlg()) closeOverlay(true); });
$$('dialog.ov').forEach((d) => {
  d.addEventListener('cancel', (e) => { e.preventDefault(); closeOverlay(); });
  if (d.id === 'theater') d.addEventListener('click', (e) => { if (e.target === d) closeOverlay(); });
});

function openTheater(i) {
  const p = byId(st.route.id); if (!p) return;
  st.th = i;
  const box = $('#thMv');
  box.innerHTML = viewer(i, p.systems[i], true);
  openOverlay($('#theater'));
  const v = $('video', box); if (v) playLoud(v);
}
function openBlueprint(i) {
  const s = byId(st.route.id).systems[i];
  $('#bpTitle').textContent = t(s.title);
  /* A fresh iframe per open: changing an existing iframe's src adds session-history
     entries, which would make the phone's back gesture step the hidden viewer. */
  const f = document.createElement('iframe');
  f.id = 'bpFrame'; f.title = t(s.title);
  f.src = 'blueprint-viewer/index.html?src=' + s.blueprint.map((x) => 'assets/' + x).join(',');
  $('#bp').appendChild(f);
  openOverlay($('#bp'));
}

/* ---------- routing ---------- */
function parse() {
  const [tab, id] = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/');
  const ok = S.tabs.some((x) => x[0] === tab) ? tab : 'status';
  const p = ok === 'inventory' && id ? byId(id) : null;
  return { tab: ok, id: p && p.cover ? p.id : null };
}
const keyOf = (r) => r.tab + (r.id ? '/' + r.id : '');

function renderView() {
  const r = st.route, p = r.id ? byId(r.id) : null;
  $$('video', view).forEach((v) => { io.unobserve(v); v.removeAttribute('src'); v.load(); });
  view.innerHTML = p ? vDetail(p) : r.tab === 'skills' ? vSkills() : r.tab === 'inventory' ? vGrid() : r.tab === 'contact' ? vContact() : vStatus();
  $$('img.fade', view).forEach((im) => { if (im.complete && im.naturalWidth) im.classList.add('in'); });
  watch(view);
}

let swapT = 0;
function navigate(next, first) {
  const cur = st.route;
  if (cur.tab === next.tab && cur.id === next.id) return;
  if (openDlg()) closeOverlay(true);
  st.scroll[keyOf(cur)] = scroller().scrollTop;
  st.fromGrid = !!next.id && cur.tab === 'inventory' && !cur.id;
  if (next.id !== cur.id) st.mi = {};
  st.route = next;
  if (next.tab === 'inventory') st.invSeen = true;
  paintHeader();
  const detail = !!next.id, sizeChange = detail !== !!cur.id;
  const done = () => {
    html.classList.toggle('is-detail', detail);
    accent(detail ? byId(next.id) : null);
    renderView();
    const back = !next.id && next.tab === 'inventory' && cur.id;
    scroller().scrollTop = back ? (st.scroll[keyOf(next)] || 0) : 0;
    placeBar(); pinHeader();
  };
  if (first || reduced) { done(); return; }
  clearTimeout(swapT);
  view.classList.add('out');
  swapT = setTimeout(() => {
    done();
    /* The shell animates its size into and out of a case study; content waits
       for it so the grid isn't re-laid out every frame of the resize. */
    const wait = sizeChange && !mqPhone.matches ? 340 : 0;
    swapT = setTimeout(() => { view.classList.remove('out'); if (!first) view.focus({ preventScroll: true }); }, wait);
  }, 190);
}
addEventListener('hashchange', () => navigate(parse()));

/* ---------- language ---------- */
const GLYPHS = 'ÁÉÍÓÖŐÚÜŰ#%&@$*+=<>/\\|01░▒';
function glitch(s, p) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === ' ' || c === '\n' || c === '—') { out += c; continue; }
    const h = ((i * 2654435761) % 1000) / 1000;
    const thr = (i / s.length) * 0.72 + h * 0.28;
    out += p > thr ? c : GLYPHS[(i * 7 + Math.floor(p * 97) * 13 + Math.floor(h * 1000)) % GLYPHS.length];
  }
  return out;
}
/* The target text is in place from the first frame; each character stays masked
   by a glyph until its own threshold passes, so lengths never change mid-decode. */
let decodeT = 0;
function decode() {
  if (reduced) return;
  const nodes = [], w = document.createTreeWalker(shell, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.data.trim() ? 1 : 3) });
  for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push([n, n.data]);
  let step = 0;
  const frame = () => {
    const p = step / 6;
    nodes.forEach(([n, s]) => { n.data = p >= 1 ? s : glitch(s, p); });
    shell.style.filter = p >= 1 ? '' : 'blur(' + (1.7 * Math.sin(Math.PI * p)).toFixed(2) + 'px)';
    if (p >= 1) { clearInterval(decodeT); placeBar(); }
    step++;
  };
  clearInterval(decodeT); frame();
  decodeT = setInterval(frame, 26);
}
function setLang(l) {
  if (l === st.lang) return;
  st.lang = l; store('et-lang', l); html.lang = l;
  const y = scroller().scrollTop;
  paintHeader(); renderView(); scroller().scrollTop = y; pinHeader();
  decode();
}

/* ---------- contact ---------- */
function copyEmail(btn) {
  const sw = $('.swap', btn);
  const done = () => {
    clearTimeout(btn._t1); clearTimeout(btn._t2); clearTimeout(btn._t3);
    sw.classList.add('fading');
    btn._t1 = setTimeout(() => { btn.classList.add('copied'); sw.classList.remove('fading'); }, 170);
    btn._t2 = setTimeout(() => sw.classList.add('fading'), 2100);
    btn._t3 = setTimeout(() => { btn.classList.remove('copied'); sw.classList.remove('fading'); }, 2270);
  };
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = S.email; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    } catch (e) {}
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(S.email).then(done, legacy);
  else legacy();
}

let fbT = 0;
function fbStatus(form, msg, err) {
  const el = $('.status', form);
  el.textContent = msg ? t(msg) : ''; el.classList.toggle('err', !!err);
  clearTimeout(fbT);
  if (msg && !err && msg !== 'SENDING…') fbT = setTimeout(() => { el.textContent = ''; }, 5000);
}
async function sendFeedback(form) {
  const d = st.draft, text = d.text.trim(), btn = $('.send', form), F = (k) => form.elements.namedItem(k);
  if (!text) { fbStatus(form, 'WRITE SOMETHING FIRST', true); return; }
  const entry = { at: new Date().toISOString(), name: d.name.trim() || null, email: d.email.trim() || null, text, lang: st.lang };
  btn.disabled = true; fbStatus(form, 'SENDING…');
  try {
    /* Apps Script answers without CORS headers, so this is fire-and-forget:
       a resolved fetch means it left the browser; only a network error rejects. */
    if (!F('website').value) {
      await fetch(S.feedbackEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(entry) });
    }
    st.sent = entry; st.draft = { name: '', email: '', text: '' };
    ['name', 'email', 'text'].forEach((k) => { F(k).value = ''; });
    F('name').placeholder = entry.name || t('Your name (optional)');
    F('email').placeholder = entry.email || t('Email for a reply (optional)');
    F('text').placeholder = text;
    fbStatus(form, 'THANKS — YOUR NOTE IS LOGGED');
  } catch (e) {
    fbStatus(form, 'COULDN’T SEND — PLEASE EMAIL ME INSTEAD', true);
  } finally { btn.disabled = false; }
}
view.addEventListener('input', (e) => {
  const f = e.target;
  if (f.form && f.form.id === 'fb' && f.name in st.draft) { st.draft[f.name] = f.value; fbStatus(f.form, ''); }
});
view.addEventListener('submit', (e) => { if (e.target.id === 'fb') { e.preventDefault(); sendFeedback(e.target); } });

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-sfx]')) select();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const i = +el.dataset.sys;
  switch (el.dataset.act) {
    case 'lang': select(); setLang(el.dataset.lang); break;
    case 'back': if (st.fromGrid) history.back(); else location.hash = '#inventory'; break;
    case 'step': showMedia(i, (st.mi[i] || 0) + +el.dataset.d); break;
    case 'pick': showMedia(i, +el.dataset.n); break;
    case 'theater': openTheater(i); break;
    case 'bp': openBlueprint(i); break;
    case 'close': closeOverlay(); break;
    case 'copy': copyEmail(el); break;
    case 'toggle':
      if (el.paused) { delete el.dataset.paused; play(el); } else { el.dataset.paused = '1'; el.pause(); }
      break;
    case 'yt': {
      const p = byId(st.route.id);
      if (location.protocol === 'file:') { open('https://youtu.be/' + p.youtube, '_blank', 'noopener'); break; }
      el.outerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + p.youtube + '?rel=0&modestbranding=1&playsinline=1&autoplay=1" title="' + tt('Gameplay capture') + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
      break;
    }
  }
});

document.addEventListener('load', (e) => { const im = e.target; if (im.classList && im.classList.contains('fade')) im.classList.add('in'); }, true);

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target;
  if (tg && (tg.isContentEditable || /^(input|textarea|select)$/i.test(tg.tagName))) return;
  if (theaterOpen() && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { showMedia(st.th, (st.mi[st.th] || 0) + (e.key === 'ArrowLeft' ? -1 : 1)); return; }
  if (openDlg()) return;
  if (e.key === 'Escape' && st.route.id) { $('.back', view).click(); return; }
  const k = e.key && e.key.toLowerCase();
  if (k !== 'e' && k !== 'q') return;
  const ids = S.tabs.map((x) => x[0]), i = ids.indexOf(st.route.tab);
  select();
  location.hash = '#' + ids[(i + (k === 'e' ? 1 : ids.length - 1)) % ids.length];
});

const onLayout = () => { placeBar(); pinHeader(); };
new ResizeObserver(onLayout).observe(head);
if (mqPhone.addEventListener) mqPhone.addEventListener('change', onLayout); else mqPhone.addListener(onLayout);
if (document.fonts) document.fonts.ready.then(onLayout);

/* ---------- boot ---------- */
html.lang = st.lang;
navigate(parse(), true);
(() => {
  let seen = false;
  try { seen = sessionStorage.getItem('et-boot') === '1'; sessionStorage.setItem('et-boot', '1'); } catch (e) {}
  if (seen || reduced) return;
  const boot = $('#boot'), caret = $('i', boot);
  boot.hidden = false;
  let i = 0;
  const tick = setInterval(() => {
    caret.insertAdjacentHTML('beforebegin', '<div>' + tt(S.boot[i]) + '</div>');
    if (++i < S.boot.length) return;
    clearInterval(tick);
    setTimeout(() => { boot.classList.add('done'); setTimeout(() => { boot.hidden = true; }, 260); }, 520);
  }, 300);
})();
})();
</script>
